apiVersion: apps/v1
kind: Deployment
metadata:
  name: athenaeum-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: athenaeum-api
  template:
    metadata:
      labels:
        app: athenaeum-api
    spec:
      containers:
      - name: athenaeum-api
        image: athenaeum:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: CHROMA_DIR
          value: /data/chroma_data
        volumeMounts:
        - name: athenaeum-data
          mountPath: /data
      volumes:
      - name: athenaeum-data
        persistentVolumeClaim:
          claimName: athenaeum-data
---
apiVersion: v1
kind: Service
metadata:
  name: athenaeum-api
spec:
  selector:
    app: athenaeum-api
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: athenaeum-api
spec:
  rules:
  - host: athenaeum.home.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: athenaeum-api
            port:
              number: 8000
