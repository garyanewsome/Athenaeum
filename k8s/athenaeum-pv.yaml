apiVersion: v1
kind: PersistentVolume
metadata:
  name: athenaeum-data-pv
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/storage/athenaeum-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: athenaeum-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 50Gi
